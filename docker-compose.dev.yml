version: '3.8'

# ============================================================================
# Configuración de desarrollo local (sin Swarm)
# Para pruebas locales antes de desplegar en Swarm
# ============================================================================

services:
  # Metadata Service
  metadata:
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.metadata
    container_name: ftp-metadata
    hostname: metadata
    environment:
      - NODE_ID=metadata-1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/metadata:/data/metadata
    networks:
      - ftp_network
    ports:
      - "5000:5000"

  # Storage Service 1
  storage1:
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.storage
    container_name: ftp-storage-1
    hostname: storage-1
    environment:
      - NODE_ID=storage-1
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/storage1:/data/storage
    networks:
      - ftp_network
    depends_on:
      - metadata

  # Storage Service 2
  storage2:
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.storage
    container_name: ftp-storage-2
    hostname: storage-2
    environment:
      - NODE_ID=storage-2
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/storage2:/data/storage
    networks:
      - ftp_network
    depends_on:
      - metadata

  # Storage Service 3
  storage3:
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.storage
    container_name: ftp-storage-3
    hostname: storage-3
    environment:
      - NODE_ID=storage-3
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/storage3:/data/storage
    networks:
      - ftp_network
    depends_on:
      - metadata

  # Router Service (FTP Frontend)
  router:
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.router
    container_name: ftp-router
    hostname: router
    environment:
      - NODE_ID=router-1
      - PUBLIC_IP=${PUBLIC_IP:-localhost}
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - ftp_network
    depends_on:
      - metadata
      - storage1
      - storage2
      - storage3

networks:
  ftp_network:
    driver: bridge


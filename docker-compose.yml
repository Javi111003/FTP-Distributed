version: '3.8'

services:
  ftpserver:
    image: ftpserver:latest
    ports:
      - target: 21
        published: 21
        protocol: tcp
        mode: host
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host
      - target: 30001
        published: 30001
        protocol: tcp
        mode: host
      - target: 30002
        published: 30002
        protocol: tcp
        mode: host
      - target: 30003
        published: 30003
        protocol: tcp
        mode: host
      - target: 30004
        published: 30004
        protocol: tcp
        mode: host
      - target: 30005
        published: 30005
        protocol: tcp
        mode: host
      - target: 30006
        published: 30006
        protocol: tcp
        mode: host
      - target: 30007
        published: 30007
        protocol: tcp
        mode: host
      - target: 30008
        published: 30008
        protocol: tcp
        mode: host
      - target: 30009
        published: 30009
        protocol: tcp
        mode: host
    environment:
      PUBLICHOST: "0.0.0.0"
      USERNAME: "admin"
      PASSWORD: "admin123"
    volumes:
      - type: bind
        source: ./FTP/FTPRoot
        target: /app/FTP/FTPRoot
      - type: bind
        source: ./FTP/Server/Auth
        target: /app/FTP/Server/Auth
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - ftpnet

networks:
  ftpnet:
    driver: overlay

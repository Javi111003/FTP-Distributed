version: '3.8'

# ============================================================================
# Sistema FTP Distribuido para Docker Swarm
# ============================================================================
# Arquitectura:
#   - Router (R): 2 réplicas - Punto de entrada FTP, proxy a storage
#   - Metadata (M): 2 réplicas - Coordinación, namespace, gestión de réplicas
#   - Storage (S): 3 réplicas - Almacenamiento físico con replicación
#
# Redes:
#   - frontend_net: Conexión con clientes externos (Router)
#   - backend_net: Comunicación interna entre servicios
# ============================================================================

services:
  # ==========================================================================
  # SERVICIO METADATA - Coordinación y gestión de metadatos
  # ==========================================================================
  metadata:
    image: ftp-metadata:latest
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.metadata
    hostname: "metadata-{{.Task.Slot}}"
    environment:
      - NODE_ID=metadata-{{.Task.Slot}}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PYTHONUNBUFFERED=1
    volumes:
      - metadata_data_{{.Task.Slot}}:/data/metadata
    networks:
      - backend_net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 5000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # SERVICIO STORAGE - Almacenamiento de archivos
  # ==========================================================================
  storage:
    image: ftp-storage:latest
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.storage
    hostname: "storage-{{.Task.Slot}}"
    environment:
      - NODE_ID=storage-{{.Task.Slot}}
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - storage_data_{{.Task.Slot}}:/data/storage
    networks:
      - backend_net
    depends_on:
      - metadata
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 5001)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # SERVICIO ROUTER - Frontend FTP
  # ==========================================================================
  router:
    image: ftp-router:latest
    build:
      context: .
      dockerfile: FTP/Distributed/Dockerfile.router
    hostname: "router-{{.Task.Slot}}"
    environment:
      - NODE_ID=router-{{.Task.Slot}}
      - PUBLIC_IP=${PUBLIC_IP:-}
      - METADATA_HOST=metadata
      - METADATA_PORT=5000
      - PYTHONUNBUFFERED=1
    ports:
      # Puerto FTP principal
      - target: 21
        published: 21
        protocol: tcp
        mode: host
      # Rango de puertos PASV
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host
      - target: 30001
        published: 30001
        protocol: tcp
        mode: host
      - target: 30002
        published: 30002
        protocol: tcp
        mode: host
      - target: 30003
        published: 30003
        protocol: tcp
        mode: host
      - target: 30004
        published: 30004
        protocol: tcp
        mode: host
      - target: 30005
        published: 30005
        protocol: tcp
        mode: host
      - target: 30006
        published: 30006
        protocol: tcp
        mode: host
      - target: 30007
        published: 30007
        protocol: tcp
        mode: host
      - target: 30008
        published: 30008
        protocol: tcp
        mode: host
      - target: 30009
        published: 30009
        protocol: tcp
        mode: host
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - metadata
      - storage
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 21)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# ============================================================================
# REDES
# ============================================================================
networks:
  # Red frontend para conexiones de clientes
  frontend_net:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.10.0.0/24

  # Red backend para comunicación interna
  backend_net:
    driver: overlay
    internal: true
    attachable: true
    ipam:
      config:
        - subnet: 10.20.0.0/24

# ============================================================================
# VOLÚMENES PERSISTENTES
# ============================================================================
volumes:
  # Volúmenes para Metadata (uno por réplica)
  metadata_data_1:
    driver: local
  metadata_data_2:
    driver: local
  
  # Volúmenes para Storage (uno por réplica)
  storage_data_1:
    driver: local
  storage_data_2:
    driver: local
  storage_data_3:
    driver: local

